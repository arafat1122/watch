<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #2c3e50;
            font-family: Arial, sans-serif;
        }

        .clock {
            width: 400px;
            height: 400px;
            border: 8px solid #fff;
            border-radius: 50%;
            background: #34495e;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* Clock Numbers */
        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .number1 { transform: rotate(30deg); }
        .number1 span { display: inline-block; transform: rotate(-30deg); margin-top: 12px; }

        .number2 { transform: rotate(60deg); }
        .number2 span { display: inline-block; transform: rotate(-60deg); margin-top: 12px; }

        .number3 { transform: rotate(90deg); }
        .number3 span { display: inline-block; transform: rotate(-90deg); margin-top: 12px; }

        .number4 { transform: rotate(120deg); }
        .number4 span { display: inline-block; transform: rotate(-120deg); margin-top: 12px; }

        .number5 { transform: rotate(150deg); }
        .number5 span { display: inline-block; transform: rotate(-150deg); margin-top: 12px; }

        .number6 span {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .number7 { transform: rotate(210deg); }
        .number7 span {
            display: inline-block;
            transform: rotate(-210deg);
            position: absolute;
            bottom: 15px;
            left: 80px;
        }

        .number8 { transform: rotate(240deg); }
        .number8 span {
            display: inline-block;
            transform: rotate(-240deg);
            position: absolute;
            bottom: 60px;
            left: 25px;
        }

        .number9 span {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .number10 { transform: rotate(300deg); }
        .number10 span {
            display: inline-block;
            transform: rotate(-300deg);
            position: absolute;
            top: 55px;
            left: 25px;
        }

        .number11 { transform: rotate(330deg); }
        .number11 span {
            display: inline-block;
            transform: rotate(-330deg);
            position: absolute;
            top: 15px;
            left: 80px;
        }

        .number12 span {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Hands */
        .hand {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0% 50%;
        }

        .hour {
            width: 90px;
            height: 6px;
            background: white;
            border-radius: 5px;
        }

        .minute {
            width: 130px;
            height: 4px;
            background: white;
            border-radius: 5px;
        }

        .second {
            width: 160px;
            height: 2px;
            background: red;
        }

        .center {
            width: 15px;
            height: 15px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>

<div class="clock">

    <div class="number number12"><span>12</span></div>
    <div class="number number1"><span>1</span></div>
    <div class="number number2"><span>2</span></div>
    <div class="number number3"><span>3</span></div>
    <div class="number number4"><span>4</span></div>
    <div class="number number5"><span>5</span></div>
    <div class="number number6"><span>6</span></div>
    <div class="number number7"><span>7</span></div>
    <div class="number number8"><span>8</span></div>
    <div class="number number9"><span>9</span></div>
    <div class="number number10"><span>10</span></div>
    <div class="number number11"><span>11</span></div>

    <div class="hand hour"></div>
    <div class="hand minute"></div>
    <div class="hand second"></div>

    <div class="center"></div>

</div>

<script>
function updateClock() {
    const now = new Date();

    const sec = now.getSeconds();
    const min = now.getMinutes();
    const hr = now.getHours() % 12;

    // Calculate the angles for each hand
    const secDeg = (sec / 60) * 360;
    const minDeg = ((min + sec / 60) / 60) * 360;
    const hrDeg = (((hr + min / 60) / 12) % 1) * 360;

    // Update the hands
    document.querySelector(".second").style.transform =
        `translate(0, -50%) rotate(${secDeg}deg)`;

    document.querySelector(".minute").style.transform =
        `translate(0, -50%) rotate(${minDeg}deg)`;

    document.querySelector(".hour").style.transform =
        `translate(0, -50%) rotate(${hrDeg}deg)`;
}

// Update the clock immediately when the page loads
updateClock();

// Set an interval to update every second
setInterval(updateClock, 1000);
</script>

</body>
</html>
