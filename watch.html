<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Analog Clock</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e293b);
}

.container{
    text-align:center;
}

.clock{
    width:320px;
    height:320px;
    border:8px solid #fff;
    border-radius:50%;
    position:relative;
    background:#111827;
    box-shadow:0 0 30px rgba(255,255,255,.15);
}

.number{
    position:absolute;
    width:100%;
    height:100%;
    text-align:center;
    color:#fff;
    font-size:22px;
    font-weight:bold;
}

.number span{
    display:inline-block;
    margin-top:10px;
}

.hand{
    position:absolute;
    top:50%;
    left:50%;
    transform-origin:0% 50%;
    border-radius:10px;
}

.hour{
    width:80px;
    height:6px;
    background:#fff;
}

.minute{
    width:110px;
    height:4px;
    background:#38bdf8;
}

.second{
    width:130px;
    height:2px;
    background:#ef4444;
}

.center{
    width:14px;
    height:14px;
    background:#fff;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.digital{
    margin-top:25px;
    color:#fff;
    font-size:32px;
    font-weight:bold;
}

.date{
    margin-top:10px;
    color:#cbd5e1;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<div class="clock">

<div class="number" style="transform:rotate(0deg)"><span>12</span></div>
<div class="number" style="transform:rotate(30deg)"><span style="transform:rotate(-30deg);display:inline-block;">1</span></div>
<div class="number" style="transform:rotate(60deg)"><span style="transform:rotate(-60deg);display:inline-block;">2</span></div>
<div class="number" style="transform:rotate(90deg)"><span style="transform:rotate(-90deg);display:inline-block;">3</span></div>
<div class="number" style="transform:rotate(120deg)"><span style="transform:rotate(-120deg);display:inline-block;">4</span></div>
<div class="number" style="transform:rotate(150deg)"><span style="transform:rotate(-150deg);display:inline-block;">5</span></div>
<div class="number" style="transform:rotate(180deg)"><span style="transform:rotate(-180deg);display:inline-block;">6</span></div>
<div class="number" style="transform:rotate(210deg)"><span style="transform:rotate(-210deg);display:inline-block;">7</span></div>
<div class="number" style="transform:rotate(240deg)"><span style="transform:rotate(-240deg);display:inline-block;">8</span></div>
<div class="number" style="transform:rotate(270deg)"><span style="transform:rotate(-270deg);display:inline-block;">9</span></div>
<div class="number" style="transform:rotate(300deg)"><span style="transform:rotate(-300deg);display:inline-block;">10</span></div>
<div class="number" style="transform:rotate(330deg)"><span style="transform:rotate(-330deg);display:inline-block;">11</span></div>

<div class="hand hour"></div>
<div class="hand minute"></div>
<div class="hand second"></div>

<div class="center"></div>

</div>

<div class="digital" id="time"></div>
<div class="date" id="date"></div>

</div>

<script>
function updateClock(){

    const now=new Date();

    const h=now.getHours()%12;
    const m=now.getMinutes();
    const s=now.getSeconds();

    document.querySelector(".hour").style.transform=
    `translateY(-50%) rotate(${h*30+m*0.5}deg)`;

    document.querySelector(".minute").style.transform=
    `translateY(-50%) rotate(${m*6+s*0.1}deg)`;

    document.querySelector(".second").style.transform=
    `translateY(-50%) rotate(${s*6}deg)`;

    document.getElementById("time").innerHTML=
    now.toLocaleTimeString();

    document.getElementById("date").innerHTML=
    now.toDateString();
}

updateClock();
setInterval(updateClock,1000);
</script>

</body>
</html>
